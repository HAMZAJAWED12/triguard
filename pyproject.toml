[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "triguard"
version = "0.1.0"
description = "Multimodal, explainable, locally deployable content moderation pipeline (Tier-A prototype)"
authors = [{name = "Hamza"}]
requires-python = ">=3.10"
dependencies = ["pydantic>=2.0,<3", "scikit-learn>=1.3,<2"]

[project.optional-dependencies]
# `pip install -e ".[eval]"` — public datasets (T2) + real perception models.
# For CPU-only torch wheels add: --extra-index-url https://download.pytorch.org/whl/cpu
# (extra indexes can't live in pyproject; see requirements.txt).
eval = [
    "datasets>=2.18,<4",
    "numpy>=1.24,<2",
    "transformers>=4.40,<5",
    "torch>=2.2,<3",
    "pillow>=10,<12",
    # T4 audio eval — word error rate (Whisper) on LibriSpeech
    "jiwer>=3.0,<4",
    # Prompt 5 — FastAPI demo (httpx = TestClient dependency)
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
    "python-multipart>=0.0.9,<1",
    "httpx>=0.27,<1",
    # Phase B — opt-in OCR for the image track. RapidOCR (ONNX runtime): torch-free,
    # so it does not disturb the pinned torch/torchvision-free numpy<2 stack.
    "rapidocr-onnxruntime>=1.3,<2",
    # Phase C — T8 hardware-viability measurement (peak RAM)
    "psutil>=5.9,<7",
]
# Sprint 3 — real audio (Whisper + YAMNet). REQUIRES Python <= 3.12
# (TensorFlow / numba have no 3.14 wheels). Install into a py3.12 venv;
# see scripts/run_wsl_sprint3.sh (uv-provisioned ~/.venv-triguard-audio). Needs ffmpeg.
audio = [
    "openai-whisper>=20231117",
    "tensorflow>=2.15,<3",
    "tensorflow-hub>=0.16",
    "librosa>=0.10,<1",
    "soundfile>=0.12",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pylint.MASTER]
# Put the src/ layout on the path so Pylint resolves `triguard.*` imports
# (kills the spurious E0401 import-error reports). Mirrors PYTHONPATH=src.
init-hook = 'import sys; sys.path.insert(0, "src")'
# Optional heavy ML libs are lazy-imported and live only in the WSL venvs
# (.venv-linux / ~/.venv-triguard-audio), not the Windows .venv — don't flag them.
ignored-modules = ["librosa", "soundfile", "whisper", "tensorflow", "tensorflow_hub", "PIL"]

[tool.pylint.messages_control]
# Disable checks that clash with this project's documented house style:
#   - lazy heavy-ML imports inside loaders (CLAUDE.md rule)
#   - deliberate broad except for graceful wrapper/judge fallbacks
#   - module-level cache flag toggled via `global`
#   - terse functions, self-documenting pydantic models, docstring-free tests
disable = [
    "import-outside-toplevel",
    "broad-exception-caught",
    "global-statement",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
]

[tool.pyright]
# Optional heavy ML libs (librosa/whisper/tensorflow/PIL/...) are lazy-imported
# and absent from the Windows interpreter VS Code analyses with — they install
# only in the WSL venvs. Silence the resulting missing-import noise; runtime is
# guarded with per-component fallbacks and verified green in WSL.
reportMissingImports = "none"
reportMissingModuleSource = "none"
