<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .box{fill:#f4f4f6;stroke:#555;stroke-width:1.2}
    .core{fill:#e8eef8;stroke:#0b3d91;stroke-width:1.5}
    .lbl{fill:#111}
    .sub{fill:#555;font-size:11px}
    .flow{stroke:#333;stroke-width:1.3;fill:none;marker-end:url(#arr)}
    .fallback{stroke:#7a4a02;stroke-width:1.2;fill:none;stroke-dasharray:5 4;marker-end:url(#arr)}
    .title{font-size:15px;font-weight:bold}
  </style>

  <text x="480" y="24" text-anchor="middle" class="title">TriGuard architecture — perception wrappers, orchestrator, judge, surfaces</text>

  <!-- inputs -->
  <rect x="20" y="60" width="120" height="34" class="box"/>
  <text x="80" y="81" text-anchor="middle" class="lbl">text</text>
  <rect x="20" y="150" width="120" height="34" class="box"/>
  <text x="80" y="171" text-anchor="middle" class="lbl">image file</text>
  <rect x="20" y="240" width="120" height="34" class="box"/>
  <text x="80" y="261" text-anchor="middle" class="lbl">audio file</text>

  <!-- wrappers -->
  <rect x="190" y="48" width="220" height="58" class="box"/>
  <text x="300" y="68" text-anchor="middle" class="lbl">text wrapper</text>
  <text x="300" y="84" text-anchor="middle" class="sub">mock | sklearn TF-IDF (default) |</text>
  <text x="300" y="97" text-anchor="middle" class="sub">toxic-bert (opt-in, pinned rev)</text>

  <rect x="190" y="138" width="220" height="58" class="box"/>
  <text x="300" y="158" text-anchor="middle" class="lbl">image wrapper</text>
  <text x="300" y="174" text-anchor="middle" class="sub">mock (default) | BLIP captioner</text>
  <text x="300" y="187" text-anchor="middle" class="sub">+ opt-in RapidOCR (TRIGUARD_IMAGE_OCR)</text>

  <rect x="190" y="228" width="220" height="58" class="box"/>
  <text x="300" y="248" text-anchor="middle" class="lbl">audio wrapper</text>
  <text x="300" y="264" text-anchor="middle" class="sub">mock (default) | Whisper transcription</text>
  <text x="300" y="277" text-anchor="middle" class="sub">+ YAMNet event tags (per-part fallback)</text>

  <!-- evidence schemas -->
  <rect x="460" y="138" width="150" height="58" class="core"/>
  <text x="535" y="160" text-anchor="middle" class="lbl">pydantic evidence</text>
  <text x="535" y="176" text-anchor="middle" class="sub">TextEvidence / ImageEvidence</text>
  <text x="535" y="189" text-anchor="middle" class="sub">/ AudioEvidence (frozen schema)</text>

  <!-- orchestrator -->
  <rect x="460" y="250" width="150" height="72" class="core"/>
  <text x="535" y="272" text-anchor="middle" class="lbl">orchestrator</text>
  <text x="535" y="288" text-anchor="middle" class="sub">wrapper-failure shielding,</text>
  <text x="535" y="301" text-anchor="middle" class="sub">honest model_versions,</text>
  <text x="535" y="314" text-anchor="middle" class="sub">latency capture</text>

  <!-- judge -->
  <rect x="680" y="138" width="250" height="70" class="core"/>
  <text x="805" y="158" text-anchor="middle" class="lbl">LLM judge (JudgeInput → JudgeOutput)</text>
  <text x="805" y="175" text-anchor="middle" class="sub">rule-based (deterministic, offline default)</text>
  <text x="805" y="189" text-anchor="middle" class="sub">llama3-8B via local Ollama (opt-in),</text>
  <text x="805" y="202" text-anchor="middle" class="sub">JSON schema validation + one retry</text>

  <rect x="680" y="250" width="250" height="46" class="box"/>
  <text x="805" y="269" text-anchor="middle" class="lbl">rule fallback</text>
  <text x="805" y="285" text-anchor="middle" class="sub">tagged ollama_unavailable / judge_output_invalid → label "ollama→rule"</text>

  <!-- result -->
  <rect x="460" y="380" width="470" height="52" class="core"/>
  <text x="695" y="401" text-anchor="middle" class="lbl">TriGuardResult (schema-valid by construction)</text>
  <text x="695" y="418" text-anchor="middle" class="sub">risk_score · risk_label · flagged_modalities · rationale · uncertainties · recommended_action · model_versions · latency_ms</text>

  <!-- surfaces -->
  <rect x="60" y="490" width="180" height="72" class="box"/>
  <text x="150" y="512" text-anchor="middle" class="lbl">CLI</text>
  <text x="150" y="529" text-anchor="middle" class="sub">run / analyse,</text>
  <text x="150" y="542" text-anchor="middle" class="sub">--judge rule|ollama</text>

  <rect x="300" y="490" width="300" height="72" class="box"/>
  <text x="450" y="510" text-anchor="middle" class="lbl">FastAPI demo (127.0.0.1)</text>
  <text x="450" y="527" text-anchor="middle" class="sub">/ui presets · rule-vs-llama3 compare ·</text>
  <text x="450" y="540" text-anchor="middle" class="sub">SSE llama3 streaming · /dashboard (verbatim eval numbers)</text>

  <rect x="660" y="490" width="270" height="72" class="box"/>
  <text x="795" y="510" text-anchor="middle" class="lbl">evaluation harnesses</text>
  <text x="795" y="527" text-anchor="middle" class="sub">T1–T8 → outputs/evaluation/&lt;run&gt;/results.json</text>
  <text x="795" y="540" text-anchor="middle" class="sub">+ failure analysis, grounding, perf</text>

  <!-- flows -->
  <line x1="140" y1="77" x2="190" y2="77" class="flow"/>
  <line x1="140" y1="167" x2="190" y2="167" class="flow"/>
  <line x1="140" y1="257" x2="190" y2="257" class="flow"/>
  <line x1="410" y1="77" x2="460" y2="150" class="flow"/>
  <line x1="410" y1="167" x2="460" y2="167" class="flow"/>
  <line x1="410" y1="257" x2="460" y2="200" class="flow"/>
  <line x1="535" y1="196" x2="535" y2="250" class="flow"/>
  <line x1="610" y1="286" x2="680" y2="200" class="flow"/>
  <line x1="805" y1="208" x2="805" y2="250" class="fallback"/>
  <line x1="805" y1="296" x2="700" y2="380" class="flow"/>
  <line x1="535" y1="322" x2="535" y2="380" class="flow"/>
  <line x1="460" y1="410" x2="150" y2="490" class="flow"/>
  <line x1="600" y1="432" x2="470" y2="490" class="flow"/>
  <line x1="750" y1="432" x2="795" y2="490" class="flow"/>
</svg>
