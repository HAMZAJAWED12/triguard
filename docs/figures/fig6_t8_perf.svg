<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="Arial, Helvetica, sans-serif" font-size="13">
  <style>
    .axis{stroke:#555;stroke-width:1}
    .grid{stroke:#ddd;stroke-width:1}
    .mock{fill:#c9c9c9}
    .real{fill:#0b3d91}
    .lbl{fill:#111}
    .sub{fill:#555;font-size:11px}
    .val{fill:#111;font-size:11px}
    .title{font-size:14px;font-weight:bold}
  </style>
  <text x="380" y="22" text-anchor="middle" class="title">T8 — latency and peak memory, mock vs real backends (T6 set, rule judge)</text>
  <text x="380" y="38" text-anchor="middle" class="sub">sources: outputs/evaluation/20260705-113354 (mock) and 20260705-113639 (real) t8/results.json</text>

  <!-- LEFT PANEL: latency, scale 0..4200ms over 220px, x 70..390 -->
  <line x1="70" y1="290" x2="390" y2="290" class="axis"/>
  <line x1="70" y1="70" x2="70" y2="290" class="axis"/>
  <g class="sub">
    <line x1="70" y1="180" x2="390" y2="180" class="grid"/><text x="64" y="184" text-anchor="end">2100</text>
    <line x1="70" y1="70" x2="390" y2="70" class="grid"/><text x="64" y="74" text-anchor="end">4200</text>
    <text x="64" y="294" text-anchor="end">0 ms</text>
  </g>
  <!-- mock p50 0.0 p95 0.1 (invisible ~0 bars, label them) ; real p50 31.1 h=1.63 ; p95 4075.1 h=213.5 ; cold 4075.1 -->
  <rect x="95" y="289.9" width="40" height="0.1" class="mock"/>
  <text x="115" y="283" text-anchor="middle" class="val">&#8776;0</text>
  <text x="115" y="306" text-anchor="middle" class="sub">mock p50/p95</text>
  <rect x="165" y="288.4" width="40" height="1.6" class="real"/>
  <text x="185" y="281" text-anchor="middle" class="val">31.1</text>
  <text x="185" y="306" text-anchor="middle" class="sub">real p50</text>
  <rect x="235" y="76.5" width="40" height="213.5" class="real"/>
  <text x="255" y="70" text-anchor="middle" class="val">4075.1</text>
  <text x="255" y="306" text-anchor="middle" class="sub">real p95</text>
  <rect x="305" y="76.5" width="40" height="213.5" class="real"/>
  <text x="325" y="70" text-anchor="middle" class="val">4075.1</text>
  <text x="325" y="306" text-anchor="middle" class="sub">real cold start</text>
  <text x="230" y="336" text-anchor="middle" class="lbl">latency (ms)</text>

  <!-- RIGHT PANEL: RSS, scale 0..3000MB over 220px, x 470..720 -->
  <line x1="470" y1="290" x2="720" y2="290" class="axis"/>
  <line x1="470" y1="70" x2="470" y2="290" class="axis"/>
  <g class="sub">
    <line x1="470" y1="180" x2="720" y2="180" class="grid"/><text x="464" y="184" text-anchor="end">1500</text>
    <line x1="470" y1="70" x2="720" y2="70" class="grid"/><text x="464" y="74" text-anchor="end">3000</text>
    <text x="464" y="294" text-anchor="end">0 MB</text>
  </g>
  <!-- mock 34.5 h=2.53 ; real 2873.7 h=210.7 -->
  <rect x="510" y="287.5" width="60" height="2.5" class="mock"/>
  <text x="540" y="281" text-anchor="middle" class="val">34.5</text>
  <text x="540" y="306" text-anchor="middle" class="sub">mock</text>
  <rect x="620" y="79.3" width="60" height="210.7" class="real"/>
  <text x="650" y="73" text-anchor="middle" class="val">2873.7</text>
  <text x="650" y="306" text-anchor="middle" class="sub">real</text>
  <text x="595" y="336" text-anchor="middle" class="lbl">peak RSS (MB)</text>
</svg>
