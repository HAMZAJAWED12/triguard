<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 880" font-family="Arial, Helvetica, sans-serif" font-size="12">
  <!-- fig_judge_ladder.svg — TriGuard LLM-judge fallback ladder, NON-streaming path only.
       Hand-authored from docs/figures/fig_judge_ladder.mmd; node labels and line numbers refer to
       src/triguard/models/llm_judge.py at commit 908b1e5 and src/triguard/orchestrator/pipeline.py 43-56.
       The streaming variant (judge_stream, llm_judge.py 290-332) has no retry and is not drawn.
       Caption (metadata only): Judge validation ladder (non-streaming path) — one Ollama call, one stricter
       retry, then rule-judge fallback with an honest uncertainty tag; terminal label per pipeline.judge_label. -->
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <marker id="arrf" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7a4a02"/>
    </marker>
  </defs>
  <style>
    .box{fill:#f4f4f6;stroke:#555;stroke-width:1.2}
    .dec{fill:#ffffff;stroke:#0b3d91;stroke-width:1.5}
    .llm{fill:#e8f1ff;stroke:#2b5fb3;stroke-width:1.5}
    .rule{fill:#fff4e0;stroke:#b36b00;stroke-width:1.5}
    .term{fill:#eeeeee;stroke:#555;stroke-width:1.5}
    .lbl{fill:#111}
    .mono{fill:#111;font-family:Consolas, "Courier New", monospace;font-size:11px}
    .sub{fill:#555;font-size:10.5px}
    .edge{fill:#333;font-size:10.5px}
    .flow{stroke:#333;stroke-width:1.3;fill:none;marker-end:url(#arr)}
    .fallback{stroke:#7a4a02;stroke-width:1.2;fill:none;stroke-dasharray:5 4;marker-end:url(#arrf)}
    .title{font-size:15px;font-weight:bold}
  </style>

  <text x="480" y="24" text-anchor="middle" class="title">LLM-judge validation ladder (non-streaming path, src/triguard/models/llm_judge.py)</text>

  <!-- A JudgeInput -->
  <rect x="420" y="44" width="120" height="30" class="box"/>
  <text x="480" y="64" text-anchor="middle" class="mono">JudgeInput</text>
  <path class="flow" d="M480 74 L480 100"/>

  <!-- B evidence block -->
  <rect x="340" y="100" width="280" height="42" class="box"/>
  <text x="480" y="117" text-anchor="middle" class="mono">_build_evidence_block</text>
  <text x="480" y="133" text-anchor="middle" class="sub">llm_judge.py:346-365</text>
  <path class="flow" d="M480 142 L480 166"/>

  <!-- C format -->
  <rect x="320" y="166" width="320" height="42" class="box"/>
  <text x="480" y="183" text-anchor="middle" class="mono">JUDGE_PROMPT_TEMPLATE.format(evidence_block)</text>
  <text x="480" y="199" text-anchor="middle" class="sub">:226</text>
  <path class="flow" d="M480 208 L480 232"/>

  <!-- D POST -->
  <rect x="300" y="232" width="360" height="72" class="box"/>
  <text x="480" y="250" text-anchor="middle" class="mono">POST {OLLAMA_HOST}/api/generate</text>
  <text x="480" y="266" text-anchor="middle" class="sub">stream=false, options.temperature=0.0,</text>
  <text x="480" y="280" text-anchor="middle" class="sub">keep_alive=_ollama_keep_alive(), timeout=OLLAMA_TIMEOUT</text>
  <text x="480" y="296" text-anchor="middle" class="sub">:241-255</text>
  <path class="flow" d="M480 304 L480 330"/>

  <!-- E parse / validate -->
  <rect x="300" y="330" width="360" height="58" rx="10" class="dec"/>
  <text x="480" y="348" text-anchor="middle" class="mono">_parse_judge_output</text>
  <text x="480" y="364" text-anchor="middle" class="sub">first '{' .. last '}' -&gt; json.loads -&gt; JudgeOutput.model_validate</text>
  <text x="480" y="380" text-anchor="middle" class="sub">:335-343</text>

  <!-- E valid -> V1 -->
  <path class="flow" d="M660 359 L710 359"/>
  <text x="685" y="352" text-anchor="middle" class="edge">valid</text>
  <rect x="712" y="332" width="228" height="54" class="llm"/>
  <text x="826" y="350" text-anchor="middle" class="lbl">JudgeOutput from LLM</text>
  <text x="826" y="365" text-anchor="middle" class="sub">uncertainties unchanged</text>
  <text x="826" y="380" text-anchor="middle" class="mono">judge_label = 'ollama'</text>

  <!-- E invalid -> F -->
  <path class="flow" d="M480 388 L480 424"/>
  <text x="488" y="404" class="edge">ValidationError or JSONDecodeError</text>
  <text x="488" y="416" class="edge">:231</text>

  <!-- F stricter -->
  <rect x="320" y="424" width="320" height="42" class="box"/>
  <text x="480" y="441" text-anchor="middle" class="mono">stricter = prompt + IMPORTANT suffix</text>
  <text x="480" y="457" text-anchor="middle" class="sub">:232-233</text>
  <path class="flow" d="M480 466 L480 490"/>

  <!-- G second generate -->
  <rect x="320" y="490" width="320" height="42" class="box"/>
  <text x="480" y="507" text-anchor="middle" class="mono">second _ollama_generate(stricter)</text>
  <text x="480" y="523" text-anchor="middle" class="sub">:234</text>
  <path class="flow" d="M480 532 L480 556"/>

  <!-- H parse again -->
  <rect x="320" y="556" width="320" height="42" rx="10" class="dec"/>
  <text x="480" y="573" text-anchor="middle" class="mono">_parse_judge_output</text>
  <text x="480" y="589" text-anchor="middle" class="sub">:236</text>

  <!-- H valid -> V2 -->
  <path class="flow" d="M640 577 L710 577"/>
  <text x="675" y="570" text-anchor="middle" class="edge">valid</text>
  <rect x="712" y="550" width="228" height="54" class="llm"/>
  <text x="826" y="570" text-anchor="middle" class="lbl">JudgeOutput from LLM</text>
  <text x="826" y="590" text-anchor="middle" class="mono">judge_label = 'ollama'</text>

  <!-- H invalid -> J -->
  <path class="flow" d="M480 598 L480 634"/>
  <text x="488" y="614" class="edge">invalid again</text>
  <text x="488" y="626" class="edge">:237</text>

  <!-- J JudgeFailure -->
  <rect x="340" y="634" width="280" height="34" class="box"/>
  <text x="480" y="650" text-anchor="middle" class="mono">raise JudgeFailure</text>
  <text x="480" y="662" text-anchor="middle" class="sub">:238</text>
  <path class="flow" d="M480 668 L480 694"/>

  <!-- R1 rule fallback, invalid -->
  <rect x="300" y="694" width="360" height="48" class="rule"/>
  <text x="480" y="712" text-anchor="middle" class="mono">_rule_based_judge + 'judge_output_invalid'</text>
  <text x="480" y="730" text-anchor="middle" class="sub">:99-103</text>

  <!-- R2 / R3 left column (dashed from D and G) -->
  <rect x="20" y="424" width="250" height="54" class="rule"/>
  <text x="145" y="442" text-anchor="middle" class="mono">_rule_based_judge +</text>
  <text x="145" y="457" text-anchor="middle" class="mono">'ollama_unavailable:&lt;e.reason&gt;'</text>
  <text x="145" y="472" text-anchor="middle" class="sub">:104-108</text>

  <rect x="20" y="520" width="250" height="54" class="rule"/>
  <text x="145" y="538" text-anchor="middle" class="mono">_rule_based_judge +</text>
  <text x="145" y="553" text-anchor="middle" class="mono">'ollama_unavailable:&lt;TypeName&gt;'</text>
  <text x="145" y="568" text-anchor="middle" class="sub">:109-113</text>

  <!-- D -> R2 (URLError) -->
  <path class="fallback" d="M300 268 L145 268 L145 424"/>
  <text x="150" y="300" class="edge">urllib.error.URLError</text>
  <text x="150" y="312" class="edge">(unreachable / refused)</text>
  <!-- D -> R3 (other exception) -->
  <path class="fallback" d="M300 290 L60 290 L60 520"/>
  <text x="64" y="360" class="edge">any other Exception</text>
  <text x="64" y="372" class="edge">(e.g. socket timeout)</text>
  <!-- G -> R2 -->
  <path class="fallback" d="M320 511 L290 511 L290 451 L270 451"/>
  <text x="180" y="500" class="edge">URLError / other Exception</text>

  <!-- terminal labels -->
  <rect x="300" y="780" width="360" height="72" class="term"/>
  <text x="480" y="798" text-anchor="middle" class="mono">pipeline.judge_label:</text>
  <text x="480" y="813" text-anchor="middle" class="sub">any uncertainty startswith ('ollama_unavailable', 'judge_output_invalid')</text>
  <text x="480" y="829" text-anchor="middle" class="mono">-&gt; 'ollama-&gt;rule'</text>
  <text x="480" y="845" text-anchor="middle" class="sub">pipeline.py:43-56</text>
  <path class="flow" d="M480 742 L480 780"/>
  <path class="flow" d="M145 574 L145 816 L300 816"/>
  <path class="flow" d="M60 574 L60 840 L300 840"/>

  <rect x="712" y="700" width="228" height="54" class="term"/>
  <text x="826" y="720" text-anchor="middle" class="mono">pipeline.judge_label -&gt; 'ollama'</text>
  <text x="826" y="740" text-anchor="middle" class="sub">pipeline.py:55</text>
  <path class="flow" d="M826 386 L826 550"/>
  <path class="flow" d="M826 604 L826 700"/>

  <!-- legend -->
  <rect x="20" y="800" width="14" height="14" class="llm"/><text x="40" y="811" class="sub">LLM verdict (label 'ollama')</text>
  <rect x="20" y="822" width="14" height="14" class="rule"/><text x="40" y="833" class="sub">rule-judge fallback + uncertainty tag</text>
  <line x1="20" y1="852" x2="34" y2="852" class="fallback"/><text x="40" y="856" class="sub">exception path</text>
</svg>
